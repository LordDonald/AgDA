name: AgDA CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


permissions:
  contents: read


jobs:

  backend:
    name: Backend regression and QA
    runs-on: ubuntu-latest

    steps:

      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"


      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt


      - name: Install test dependency
        run: |
          python -m pip install httpx==0.27.0


      - name: Install AgDA package
        run: |
          python -m pip install -e . --no-deps


      - name: Check dependency consistency
        run: |
          python -m pip check


      - name: Run backend regression suite
        run: |
          python tests/integration/run_backend_regression.py


      - name: Run trusted-host regression
        run: |
          python tests/integration/test_api_trusted_hosts.py


      - name: Run manual QA regressions
        run: |
          python tests/integration/test_manual_qa_regressions.py


      - name: Run user-question QA
        run: |
          python tests/qa/run_user_qa.py


  frontend:
    name: Frontend lint and production build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/web

    steps:

      - name: Check out repository
        uses: actions/checkout@v4


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json


      - name: Install frontend dependencies
        run: npm ci


      - name: Run ESLint
        run: npm run lint


      - name: Build production frontend
        run: npm run build