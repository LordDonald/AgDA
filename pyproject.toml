[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "agda"
version = "0.1.0"
description = "AgDA evidence-backed agricultural question-answering platform"
requires-python = ">=3.12"

dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "duckdb>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]


[tool.setuptools.packages.find]
where = ["."]
include = [
    "packages*",
    "apps*",
]